[package]
name = "generic_a_star"
description = "A generic implementation of the A* algorithm"
version = "8.0.3"
edition = "2024"
rust-version = "1.87.0"
license = "BSD-2-Clause"
repository = "https://github.com/sebschmi/generic_a_star"

[features]
serde = ["dep:serde"]

[dependencies]
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"], optional = true }
compare = "0.1.0"
rustc-hash = "2.1.3"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
log = "0.4.34"

[dev-dependencies]
binary-heap-plus = "0.5.0"
